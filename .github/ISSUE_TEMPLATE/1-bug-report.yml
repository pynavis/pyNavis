name: Bug report
description: Something in pyNavis does not work the way the guide says it should.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The dropdowns below are what we sort by, so please fill them in.
        The log at `%APPDATA%\pyNavis\logs\pyNavis.log` usually has the answer, so paste the relevant lines if you can.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of pyNavis is this about?
      options:
        - Installer or loading
        - pyNavis panel (Settings, Shortcuts, Console, Reload)
        - Selection panel
        - Clash panel
        - Viewpoints panel
        - AI (beta) panel
        - Data panel
        - Writing my own bundle (Python API, hooks, dock panes)
        - Documentation
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: navis-version
    attributes:
      label: Navisworks version
      options:
        - "2026"
        - "2025"
        - "2024"
        - Other or older
    validations:
      required: true
  - type: dropdown
    id: navis-edition
    attributes:
      label: Navisworks edition
      options:
        - Manage
        - Simulate
        - Freedom
    validations:
      required: true
  - type: input
    id: pynavis-version
    attributes:
      label: pyNavis version
      description: Shown in Settings, or in the installer file name.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
      placeholder: |
        1. Open a model with a clash test
        2. Click Clash Report
        3. Expected an Excel file, got a toast saying ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: Paste the relevant lines from `%APPDATA%\pyNavis\logs\pyNavis.log`. Remove file paths or project names you do not want public.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I clicked Reload on the pyNavis panel and the problem is still there.
        - label: I searched the existing issues and did not find this one.
